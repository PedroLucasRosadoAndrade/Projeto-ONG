            <div class="calendar-container">
                <h3>Eventos</h3> <br>
                <header>

                    <div class="icons">
                        <span id="prev" class="material-symbols-rounded"><</span>
                        <span id="next" class="material-symbols-rounded">></span>
                    </div>
                </header>
                <div class="calendar">
                    <ul class="weeks">
                        <li>Dom</li>
                        <li>Seg</li>

            <div class="notes-container">
                <div class="notes-header">
                    <h3>Anotações</h3>
                    <button id="add-note" class="material-symbols-rounded"></button>
                </div>
                <div class="note-form hidden">
                </div>
                <div class="notes-content">
                    <div class="selected-date"></div>
                    <ul class="notes-list"></ul>
                    <div class="note-form hidden">
                        <textarea id="note-text" placeholder="Digite sua anotação..."></textarea>
                        <div class="note-actions">
                            <button id="save-note">Salvar</button>
                            <button id="cancel-note">Cancelar</button>
                            <button id="delete-note" class="danger">Excluir</button>
                        </div>
                    </div>
                </div>
